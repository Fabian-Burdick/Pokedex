<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="icon" type="image/png" href="./assets/icons/favicon.webp" sizes="32x32" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/dialog.css" />
    <link rel="stylesheet" href="./styles/color.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <script src="./script.js" defer></script>
    <script src="./scripts/pokemon.js" defer></script>
    <script src="./scripts/dialog.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
  </head>
  <body>
    <header>
      <section>
        <div class="icon-content">
          <img src="./assets/images/pokeball.png" />
          <a href="/index.html">
            <h1>Pokédex</h1>
          </a>
        </div>
        <div class="input-content">
          <input type="search" id="pokemon-search" placeholder="Pokémon suchen" />
        </div>
      </section>
    </header>
    <main>
      <section id="pokeCards" class="card-section">
        <!--Pokémon-Cards rendered here-->
      </section>

      <dialog id="pokemonDialog">
        <section id="dialogContent" class="dialog-section">
          <!-- Pokémon-Infos rendered here -->
        </section>
      </dialog>
    </main>

    <button id="loadMoreCards" class="plus-button"><h2>+20 Pokémon</h2></button>

    <footer>
      <section>
        <p>© 2026 Created by Fabian Burdick</p>
        <ul class="footer-links">
          <li>
            <a href="">Impressum</a>
          </li>
          <li>
            <a href="">Datenschutz</a>
          </li>
        </ul>
      </section>
    </footer>
  </body>
</html>
